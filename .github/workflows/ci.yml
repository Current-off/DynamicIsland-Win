name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows 主构建。**和用户本地用的是同一份脚本** —— 这是刻意的：
  # 早期 CI 走 CMake，而用户实际用 build_cpp_msvc.sh，两条路径迟早分叉，
  # 表现就是"CI 全绿但 clone 下来编不过"。
  windows:
    name: Windows / MSVC (build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain check
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          "SDK: " + (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10

      - name: Build and test
        shell: pwsh
        run: ./tools/build.ps1

      # 单元测试覆盖不到"程序能不能起来、能不能把画面画出来"。
      # 这里跑一次离屏快照：它不需要交互式桌面（只用 --snapshot，不用 --grab），
      # 因此在 runner 上可跑；产物同时作为每次提交的视觉留档。
      - name: Startup + offscreen render smoke
        shell: pwsh
        run: |
          $exe = "build/cpp/balance_island.exe"
          $snap = "build/snap_ci.png"
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @(
            "--script", "--no-hud", "--opacity=2", "--anchor=1",
            "--duration=2600", "--snapshot=$snap", "--snapshot-at=1700",
            "--log=build/ci_smoke.log"
          )
          if ($p.ExitCode -ne 0) { throw "overlay exited with $($p.ExitCode)" }
          if (-not (Test-Path $snap)) { throw "snapshot not produced: $snap" }
          $len = (Get-Item $snap).Length
          if ($len -lt 5120) { throw "snapshot too small ($len bytes) - render likely blank" }
          "snapshot ok: $len bytes"
          if (Test-Path build/ci_smoke.log) { Get-Content build/ci_smoke.log -Tail 20 }

      # 崩溃兜底会写独立的 crash 日志；CI 上出现它说明有真问题，不能只当 warning。
      - name: Fail on crash log
        shell: pwsh
        run: |
          $crash = "build/cpp/balance-island.crash.log"
          if (Test-Path $crash) {
            Get-Content $crash
            throw "crash log produced during CI smoke run"
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: balance_island-${{ github.sha }}
          path: |
            build/cpp/balance_island.exe
            build/cpp/*_tests.exe
            build/snap_ci.png
            build/ci_smoke.log
          if-no-files-found: error

  # 平台无关的核心域（Python 参考实现 + 跨语言契约）。
  # 它不是产品的一部分，但契约是：C++ 的行为必须和这份参考实现一致。
  spec:
    name: Spec + contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reference spec and cross-language contract check
        run: python tools/verify.py
      - name: Behaviour demo
        run: python demo.py
